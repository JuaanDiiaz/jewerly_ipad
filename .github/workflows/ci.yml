# Static analysis + tests on every push/PR to the feature branches.
name: frontend-ci

on:
  push:
    branches: [master, 'feature/**']
  pull_request:
    branches: [master]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.7
      - run: flutter pub get
      # Errors turn the build red; pre-existing infos/warnings in legacy
      # screens must not (tighten later once the lint debt is paid down).
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: flutter test
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test_output.txt
      - name: publish failure details to job summary
        if: failure()
        run: |
          echo '### flutter test output (tail)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -100 test_output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"